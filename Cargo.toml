[workspace]
members = [
    ".",
    "crates/lele-build",
    "examples/sensevoice",
    "examples/silero",
    "examples/tone",
    "examples/whisper",
    "examples/supertonic",
    "examples/supertonic3",
    "examples/yolo26",
    "examples/yolo26n-seg",
    "examples/hojo-tts",
    "examples/moss-tts-nano",
    "examples/ppocr",
    "examples/web-demo",
    "examples/web-demo/crates/sensevoice-wasm",
    "examples/web-demo/crates/yolo26-wasm",
    "examples/web-demo/crates/yolo26n-seg-wasm",
    "examples/web-demo/crates/supertonic-wasm",
]
resolver = "2"

[workspace.dependencies]
lele = { path = "." }
lele-build = { path = "crates/lele-build" }
anyhow = "1.0"

[package]
name = "lele"
version = "0.1.14"
edition = "2024"
description = "Bare-metal machine learning inference library in Rust"
license = "MIT"
repository = "https://github.com/miuda-ai/lele"
authors = ["jinti <shenjindi@miuda.ai>"]
keywords = [
    "machine-learning",
    "inference",
    "onnx",
    "speech-synthesis",
    "text-to-speech",
]
categories = ["algorithms", "compilers", "science", "wasm"]
exclude = [
    "build.rs",
    "benches/*",
    "examples/*",
    "tests/*",
    "fixtures/*",
    "scripts/*",
    "src/bin/*",
    "docs/*",
]
[features]
default = ["compiler"]
compiler = ["dep:prost", "dep:thiserror"]

[dependencies]
prost = { version = "0.14.3", optional = true }
thiserror = { version = "2", optional = true }
half = "2.7.1"
aligned-vec = "0.6"
fearless_simd = "1.1"
fearless_simd_macros = "0.1"

[dev-dependencies]
approx = "0.5"
test-log = "0.2"
criterion = "0.8.2"
libm = "0.2"
# Lets tests run kernels at the scalar level too, on targets whose baseline has SIMD.
fearless_simd = { version = "1.1", features = ["force_support_fallback"] }

[[bin]]
name = "lele_gen"
path = "src/bin/lele_gen.rs"
required-features = ["compiler"]

[[bench]]
name = "kernels"
harness = false

[profile.release]
debug = true
lto = "thin"
codegen-units = 1
opt-level = 3

