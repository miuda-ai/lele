[package]
name = "hojo-tts-example"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[[bin]]
name = "hojo_tts"
path = "src/main.rs"

[dependencies]
lele = { workspace = true }
anyhow = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-normalization = "0.1"
rand = "0.8"
rand_chacha = "0.3"

[build-dependencies]
lele-build = { workspace = true }
