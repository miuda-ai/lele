# Hojo-TTS-Light: Token-LM TTS (0.08B), bilingual ZH/EN voice cloning.
# ONNX models are on Hugging Face (via hf-mirror); tokenizer + assets are on GitHub.
# Both are pinned to the v1 release this example was written for: upstream has
# since moved the files and replaced the models with an incompatible v2.
[model]
source = "url"

[[model.files]]
url = "https://hf-mirror.com/HojoAI/Hojo-TTS-Light/resolve/4c8706688ad5bfb55fbaf2df337f22c06f17812a/onnx/Hojo-TTS-Light-encoder.onnx"
dest = "onnx/Hojo-TTS-Light-encoder.onnx"

[[model.files]]
url = "https://hf-mirror.com/HojoAI/Hojo-TTS-Light/resolve/4c8706688ad5bfb55fbaf2df337f22c06f17812a/onnx/Hojo-TTS-Light-llm.onnx"
dest = "onnx/Hojo-TTS-Light-llm.onnx"

[[model.files]]
url = "https://hf-mirror.com/HojoAI/Hojo-TTS-Light/resolve/4c8706688ad5bfb55fbaf2df337f22c06f17812a/onnx/Hojo-TTS-Light-decoder.onnx"
dest = "onnx/Hojo-TTS-Light-decoder.onnx"

[[model.files]]
url = "https://raw.githubusercontent.com/HojoAI/Hojo-TTS-Light/7d3006b0f654c3c05ef6e270b0661b7b42a3bf73/tokenizer/tokenizer.json"
dest = "tokenizer/tokenizer.json"

[[model.files]]
url = "https://raw.githubusercontent.com/HojoAI/Hojo-TTS-Light/7d3006b0f654c3c05ef6e270b0661b7b42a3bf73/tokenizer/tokenizer_config.json"
dest = "tokenizer/tokenizer_config.json"

[[model.files]]
url = "https://raw.githubusercontent.com/HojoAI/Hojo-TTS-Light/7d3006b0f654c3c05ef6e270b0661b7b42a3bf73/assets/zh1.wav"
dest = "assets/zh1.wav"

[codegen]
class_name = "Hojo"
